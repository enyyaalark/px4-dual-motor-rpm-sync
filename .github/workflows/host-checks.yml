name: Host checks

on:
  push:
    paths:
      - "tools/**"
      - "tests/**"
      - "data/demo/**"
      - "firmware/stm32/App/**"
      - ".github/workflows/host-checks.yml"
  pull_request:
    paths:
      - "tools/**"
      - "tests/**"
      - "data/demo/**"
      - "firmware/stm32/App/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - run: python tools/plot_rpm_log.py data/demo/synthetic_rpm_log.csv --validate-only
      - run: c++ -std=c++17 -Wall -Wextra -Werror -fsyntax-only firmware/stm32/App/*.cpp
