name: Python tools

on:
  push:
    paths:
      - "tools/**"
      - "tests/**"
      - "data/demo/**"
      - ".github/workflows/python-tests.yml"
  pull_request:
    paths:
      - "tools/**"
      - "tests/**"
      - "data/demo/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - run: python tools/plot_rpm_log.py data/demo/synthetic_rpm_log.csv --validate-only
